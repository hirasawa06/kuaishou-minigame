<!doctype html>
<html lang="zh-CN">
<head>

<title>猫狗大战家具｜UI/UX 低保真白盒 v1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#29313a;background:#edf0f2}*{box-sizing:border-box}body{margin:0;padding:18px;display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}.notes{max-width:285px;font-size:13px;line-height:1.65}.notes h1{font-size:19px;margin:0 0 8px}.notes p{margin:6px 0}.notes ul{padding-left:20px}.debug{display:grid;gap:8px;margin-top:16px}.debug button{font-size:13px}.phone{position:relative;width:390px;height:845px;flex:none;background:#d7dfe1;border:3px solid #2c3940;border-radius:26px;overflow:hidden;box-shadow:0 8px 26px #0002}.backdrop{position:absolute;inset:0;background:linear-gradient(160deg,#dce8e7 0%,#e2dbd0 48%,#c5d5c8 100%)}.platform,.bottomsafe{position:relative;background:#505b6140;color:#24343e;text-align:center;font-size:12px;display:flex;justify-content:center;align-items:center}.platform{height:96px;border-bottom:1px dashed #56656b}.bottomsafe{height:68px;border-top:1px dashed #56656b}.content{position:relative;height:calc(100% - 164px);display:flex;flex-direction:column;padding:10px;gap:9px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.bar .label{font-weight:700}.chip,.btn,.card,.panel,.field,.stage,.status,.modalbox,.secondary{border:2px solid #647077;background:#f9f8f1;color:#25343c;border-radius:12px}.btn{padding:9px 14px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}.btn.main{background:#f3c979;border-color:#966e3d}.btn.small{min-height:40px;padding:6px 9px;font-size:13px}.btn.ghost{background:#e8ebeb}.btn:active{transform:translateY(2px);box-shadow:none}.btn[disabled]{opacity:.42;cursor:default}.stage{touch-action:pan-y;transition:transform .18s ease;padding:12px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#e4e8e1}.stage .image{width:80%;height:150px;border:2px dashed #87969a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#d1d9d4}.stage .title{font-weight:800;font-size:21px}.switchhint{font-size:12px;color:#51636b}.lockreason{font-size:12px;font-weight:700;color:#6b4932}.levelnav{display:flex;align-items:center;gap:8px}.levelnav span{min-width:125px;text-align:center}.home-spacer{flex:1}.home .btn.main{width:84%;align-self:center;font-size:23px}.home .secondary{padding:10px;font-size:13px;background:#ffffffb3}.hud{height:52px;display:flex;align-items:center;gap:7px}.hud .chip{flex:1;padding:10px 8px;white-space:nowrap;text-align:center;font-weight:700}.hud .btn{min-width:50px}.field{position:relative;flex:1;min-height:160px;background:repeating-linear-gradient(90deg,#d5e0dc 0%,#d5e0dc 33%,#c5d4d0 33.2%,#d5e0dc 33.5%);overflow:hidden;border-style:dashed}.field .lane-title{position:absolute;top:8px;left:8px;font-size:12px}.enemy{position:absolute;top:27%;padding:7px 9px;background:#d1bbad;border:1px solid #7f6960;border-radius:10px;font-size:12px}.enemy.a{left:18%}.enemy.b{right:17%;top:39%}.unit{position:absolute;bottom:21%;border-radius:20px;padding:5px 8px;background:#b6d1da;border:1px solid #53768a;font-size:12px}.photo{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff3d4;border:2px solid #987f53;border-radius:9px;padding:4px 12px;font-size:13px;white-space:nowrap}.shop{border-top:2px solid #65727a;padding-top:7px;height:226px;display:flex;flex-direction:column;gap:7px}.shoprow{display:flex;gap:6px;justify-content:space-between;align-items:center}.shoprow .chip{padding:8px;flex:1;font-size:13px;font-weight:700}.shoprow .btn{font-size:12px;padding:7px 9px;min-height:38px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1}.card{position:relative;padding:8px 8px 7px 44px;text-align:left;min-height:61px;touch-action:none;cursor:grab;font-size:13px;user-select:none}.card .portrait{position:absolute;left:7px;top:10px;width:29px;height:29px;border:1px dashed #6b7a7a;border-radius:50%;display:grid;place-items:center;font-size:11px}.card .cost{position:absolute;right:6px;top:5px;background:#ead095;border-radius:15px;border:1px solid #997a48;padding:1px 5px}.card .name{font-weight:700;display:block;max-width:83px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .role{font-size:11px;display:block;margin-top:4px}.card .info{position:absolute;left:5px;bottom:4px;border:0;background:none;color:#1f5367;cursor:pointer;font-size:11px}.card.sold{opacity:.5;cursor:default}.hint{font-size:11px;min-height:18px;text-align:center}.overlay{position:absolute;inset:96px 0 68px;background:#17232bae;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbox{padding:16px;width:100%;max-height:95%;overflow:auto;box-shadow:0 8px 0 #17232b30}.modalbox h2{margin:0 0 12px;font-size:22px}.modalbox p{font-size:14px;line-height:1.5}.modal-actions{display:grid;gap:8px}.modal-actions.two{grid-template-columns:1fr 1fr}.stats{font-size:13px;border-top:1px dashed #909a9a;margin-top:12px;padding-top:10px}.topright{margin-left:auto}.ghostcard{position:absolute;z-index:9;pointer-events:none;background:#d0e7ed;border:2px solid #53768a;border-radius:10px;padding:7px 11px;font-size:13px;box-shadow:0 6px 10px #0003}.toast{position:absolute;left:12%;right:12%;top:48%;z-index:8;background:#263d48;color:#fff;padding:9px;border-radius:11px;text-align:center;font-size:13px}.footnote{font-size:11px;color:#5e6e75}
</style>
</head>
<body>
<aside class="notes">
<h1>猫狗大战家具 · 白盒 v1</h1>
<p><b>设计讨论稿</b>。这里用 HTML 仅为了快速点击审查，不进入快手小游戏工程；正式游戏仍用 WebGL 1.0。</p>
<ul><li>主路径：选关 → 战斗 → 结算。</li><li>点卡片上阵；拖到战场指定位置；点卡片「详情」看说明。</li><li>体力、虚拟排行、局外商城暂不占首页。</li><li>灰色顶部/底部只标示安全区逻辑，实际尺寸由设备决定。</li></ul>
<div class="debug"><b>审查控制（非游戏 UI）</b><button class="btn ghost" data-act="mock-hit">模拟合照受击</button><button class="btn ghost" data-act="mock-win">模拟胜利结算</button><button class="btn ghost" data-act="mock-lose">模拟失败结算</button><button class="btn ghost" data-act="mock-cold">模拟冷启动：已通关 4 关</button><button class="btn ghost" data-act="reset">重置原型</button></div>
<p class="footnote">本原型只验证信息结构、主次、流程和安全区。没有敌方 AI、波次模拟、存档或正式美术。</p>
</aside>
<div class="phone" id="phone"><div class="backdrop"></div><div class="platform">系统 / 平台控件预留：仅背景可延伸</div><main class="content" id="content"></main><div class="bottomsafe">底部安全区：仅背景可延伸</div><div id="layer"></div><div id="toast"></div></div>
<script>
(function(){
'use strict';
var state={screen:'home',modal:'',origin:'home',level:1,unlocked:1,gold:30,cap:4,units:[],cards:[{name:'柴不破',role:'盾',cost:8},{name:'锤锤喵',role:'战',cost:6},{name:'镭射喵',role:'射',cost:7},{name:'哈利汪',role:'法',cost:9}],sold:{},photo:100,sound:true,music:true,result:'win',confirmAction:'',toastTimer:0};
var levelNames=['客厅初战','沙发防线','窗边警报','地毯守卫','书柜反击','餐厅危机','走廊突围','卧室保卫','家具围攻','家园决战'];
var content=document.getElementById('content'),layer=document.getElementById('layer'),toast=document.getElementById('toast'),phone=document.getElementById('phone');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(s){toast.innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(function(){toast.innerHTML=''},1600)}
function resetBattle(){state.gold=30;state.cap=4;state.units=[];state.sold={};state.photo=100;state.cards=[{name:'柴不破',role:'盾',cost:8},{name:'锤锤喵',role:'战',cost:6},{name:'镭射喵',role:'射',cost:7},{name:'哈利汪',role:'法',cost:9}]}
function home(){var locked=state.level>state.unlocked,completed=state.level<state.unlocked;var status=locked?'未解锁':completed?'已通关':'可挑战';var label=locked?'尚未解锁':'开始游戏';return '<div class="bar"><span class="label">单人测试 Demo</span><button class="btn small ghost" data-act="profile">资料</button><button class="btn small ghost" data-act="settings">设置</button></div><div class="home-spacer"></div><section class="stage" id="level-stage"><div class="title">第 '+state.level+' 关 · '+esc(levelNames[state.level-1])+'</div><div class="image">共享客厅 / 合照视觉占位</div><div class="levelnav"><button class="btn small" data-act="prev" '+(state.level===1?'disabled':'')+'>◀</button><span>'+state.level+'/10 · '+status+'</span><button class="btn small" data-act="next" '+(state.level===10?'disabled':'')+'>▶</button></div><div class="switchhint">← 左右滑动卡片切换 →</div><div class="footnote">守护主人与猫狗的合照</div>'+(locked?'<div class="lockreason">先通关第 '+(state.level-1)+' 关</div>':'')+'</section><div class="home-spacer"></div><button class="btn main" data-act="start" '+(locked?'disabled':'')+'>'+label+'</button><div class="secondary">次级功能：资料 / 音频设置。角色收集、体力、虚拟排行、局外商城待产品规则确认。</div>'}
function battle(){var cards=state.cards.map(function(c,i){return '<div class="card '+(state.sold[i]?'sold':'')+'" data-card="'+i+'"><span class="portrait">角色</span><span class="name">'+esc(c.name)+'</span><span class="role">'+esc(c.role)+' · 点卡上阵</span><span class="cost">'+c.cost+'</span><button class="info" data-act="detail" data-index="'+i+'">详情</button></div>'}).join('');var units=state.units.map(function(u,i){return '<span class="unit" style="left:'+u.x+'%;bottom:'+u.y+'%">'+esc(u.name)+'</span>'}).join('');return '<div class="hud"><span class="chip">第 1/10 波</span><span class="chip">剩余敌人 5</span><button class="btn small" data-act="pause">Ⅱ</button></div><div class="bar"><button class="btn small ghost" data-act="speed">1× / 2×</button><span class="footnote">战场优先显示</span></div><div class="field" id="field"><span class="lane-title">家具从上方来袭 · 三路场域</span><span class="enemy a">台灯</span><span class="enemy b">床头柜</span>'+units+'<span class="photo">合照 · 完好度 '+state.photo+'/100</span></div><div class="shop"><div class="shoprow"><span class="chip">饼干 '+state.gold+'</span><button class="btn small" data-act="refresh">刷新 2</button><button class="btn small" data-act="cap">扩建 15</button></div><div class="cards">'+cards+'</div><div class="hint">点卡上阵 · 拖卡指定落点 · 点详情看能力</div></div>'}
function result(){return '<div class="bar"><b>第 '+state.level+' 关</b></div><div class="home-spacer"></div><section class="stage"><div class="title">'+(state.result==='win'?'合照守住了':'合照失守了')+'</div><div class="image">胜负画面占位</div><div class="footnote">'+(state.result==='win'?'可继续下一关':'调整出牌再试一次')+'</div></section><div class="home-spacer"></div><div class="modal-actions">'+(state.result==='win'&&state.level<10?'<button class="btn main" data-act="next-level">下一关</button>':'')+'<button class="btn" data-act="replay">再玩一次</button><button class="btn ghost" data-act="go-home">返回选关</button><button class="btn ghost" data-act="stats">查看详细统计</button></div>'}
function modal(){var m=state.modal;if(!m)return '';var html='';if(m==='pause')html='<h2>已暂停</h2><div class="modal-actions"><button class="btn main" data-act="resume">继续游戏</button><button class="btn" data-act="settings">设置</button><button class="btn ghost" data-act="ask-restart">重新开始</button><button class="btn ghost" data-act="ask-home">返回主页</button></div>';else if(m==='settings')html='<h2>设置</h2><p>音乐与音效，不改变战斗状态。</p><div class="modal-actions"><button class="btn" data-act="music">音乐：'+(state.music?'开':'关')+'</button><button class="btn" data-act="sound">音效：'+(state.sound?'开':'关')+'</button><button class="btn ghost" data-act="close-modal">返回</button></div>';else if(m==='profile')html='<h2>个人资料</h2><p>头像 / 昵称保留为次级入口。这里不代表已拥有战斗角色。</p><button class="btn ghost" data-act="close-modal">返回</button>';else if(m==='detail'){var c=state.cards[state.detailIndex];html='<h2>'+esc(c.name)+'</h2><p>定位：'+esc(c.role)+'　费用：'+c.cost+' 饼干</p><p>此处展示角色能力、伤害与射程。点击详情不会买卡。</p><button class="btn ghost" data-act="close-modal">返回战斗</button>'}else if(m==='confirm')html='<h2>确认离开本局？</h2><p>当前战斗进度将丢失。</p><div class="modal-actions two"><button class="btn ghost" data-act="cancel-confirm">取消</button><button class="btn main" data-act="do-confirm">确认</button></div>';else if(m==='stats')html='<h2>本局统计</h2><div class="stats">抵达波次 1/10<br>合照完好度 '+state.photo+'/100<br>已上阵 '+state.units.length+' 名<br>（详细统计占位）</div><button class="btn ghost" data-act="close-modal">返回结算</button>';return '<div class="overlay"><div class="modalbox">'+html+'</div></div>'}
function render(){content.className='content '+(state.screen==='home'?'home':'');content.innerHTML=state.screen==='home'?home():state.screen==='battle'?battle():result();layer.innerHTML=modal()}
function place(i,x,y){var c=state.cards[i];if(!c||state.sold[i])return;if(state.gold<c.cost){msg('饼干不足');return}if(state.units.length>=state.cap){msg('席位已满');return}state.gold-=c.cost;state.sold[i]=true;state.units.push({name:c.name,x:x,y:y});render();msg(c.name+' 已上阵')}
function act(name,el){if(swipeBusy&&name!=='reset')return;switch(name){case 'prev':state.level=Math.max(1,state.level-1);break;case 'next':state.level=Math.min(10,state.level+1);break;case 'start':if(state.level>state.unlocked){msg('请先通关前一关');return}resetBattle();state.screen='battle';break;case 'profile':state.modal='profile';state.origin=state.screen;break;case 'settings':state.origin=state.modal==='pause'?'pause':state.screen;state.modal='settings';break;case 'pause':state.modal='pause';break;case 'resume':state.modal='';break;case 'close-modal':state.modal=state.origin==='pause'?'pause':'';break;case 'ask-restart':state.confirmAction='restart';state.modal='confirm';break;case 'ask-home':state.confirmAction='home';state.modal='confirm';break;case 'cancel-confirm':state.modal='pause';break;case 'do-confirm':if(state.confirmAction==='restart'){resetBattle();state.screen='battle'}else state.screen='home';state.modal='';break;case 'music':state.music=!state.music;break;case 'sound':state.sound=!state.sound;break;case 'refresh':if(state.gold<2){msg('饼干不足');return}state.gold-=2;state.sold={};state.cards.push(state.cards.shift());break;case 'cap':if(state.cap>=10){msg('席位已满');return}if(state.gold<15){msg('饼干不足');return}state.gold-=15;state.cap=Math.min(10,state.cap+2);msg('上场空间增加');break;case 'detail':state.detailIndex=Number(el.dataset.index);state.modal='detail';state.origin='battle';break;case 'mock-hit':if(state.screen==='battle'){state.photo=Math.max(0,state.photo-25);msg('合照受损');if(state.photo===0){state.result='lose';state.screen='result'}}break;case 'mock-win':state.result='win';state.unlocked=Math.max(state.unlocked,Math.min(10,state.level+1));state.screen='result';state.modal='';break;case 'mock-lose':state.result='lose';state.screen='result';state.modal='';break;case 'mock-cold':state.unlocked=5;state.level=5;state.screen='home';state.modal='';break;case 'reset':state.screen='home';state.modal='';state.level=1;state.unlocked=1;resetBattle();break;case 'next-level':state.level=Math.min(10,state.level+1);resetBattle();state.screen='battle';break;case 'replay':resetBattle();state.screen='battle';break;case 'go-home':state.screen='home';break;case 'stats':state.modal='stats';state.origin='result';break;case 'speed':msg('倍速切换占位');return;default:return}render()}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b){e.preventDefault();act(b.dataset.act,b);return}var card=e.target.closest('[data-card]');if(card&&state.screen==='battle'&&!state.modal&&Date.now()>suppressClickUntil)place(Number(card.dataset.card),50,22)});
var gesture=null,ghost=null,suppressClickUntil=0,levelSwipe=null,swipeBusy=false;phone.addEventListener('pointerdown',function(e){var stage=e.target.closest('#level-stage');if(stage&&!e.target.closest('button')&&state.screen==='home'&&!state.modal&&!swipeBusy){levelSwipe={x:e.clientX,y:e.clientY,dx:0,dy:0,stage:stage};stage.setPointerCapture(e.pointerId);return}var card=e.target.closest('[data-card]');if(!card||e.target.closest('[data-act]')||state.screen!=='battle'||state.modal)return;gesture={i:Number(card.dataset.card),x:e.clientX,y:e.clientY,moved:false};card.setPointerCapture(e.pointerId)});phone.addEventListener('pointermove',function(e){if(levelSwipe){levelSwipe.dx=e.clientX-levelSwipe.x;levelSwipe.dy=e.clientY-levelSwipe.y;if(Math.abs(levelSwipe.dx)>8&&Math.abs(levelSwipe.dx)>Math.abs(levelSwipe.dy)*1.3){levelSwipe.stage.style.transition='none';levelSwipe.stage.style.transform='translateX('+(levelSwipe.dx*.4)+'px)'}return}if(!gesture)return;var dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.moved&&Math.hypot(dx,dy)>8){gesture.moved=true;ghost=document.createElement('div');ghost.className='ghostcard';ghost.textContent=state.cards[gesture.i].name;phone.appendChild(ghost)}if(gesture.moved){var r=phone.getBoundingClientRect();ghost.style.left=(e.clientX-r.left-30)+'px';ghost.style.top=(e.clientY-r.top-20)+'px'}});phone.addEventListener('pointerup',function(e){if(levelSwipe){var sw=levelSwipe;levelSwipe=null;sw.stage.style.transition='transform .18s ease';var target=state.level+(sw.dx<0?1:-1);if(Math.abs(sw.dx)>=36&&Math.abs(sw.dx)>Math.abs(sw.dy)*1.3&&target>=1&&target<=10){swipeBusy=true;sw.stage.style.transform='translateX('+(sw.dx<0?-110:110)+'px)';setTimeout(function(){state.level=target;render();swipeBusy=false},180)}else sw.stage.style.transform='translateX(0px)';return}if(!gesture)return;if(gesture.moved){suppressClickUntil=Date.now()+200;var f=document.getElementById('field');var r=f&&f.getBoundingClientRect();if(r&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){var x=Math.max(8,Math.min(82,(e.clientX-r.left)/r.width*100));var y=Math.max(12,Math.min(75,(r.bottom-e.clientY)/r.height*100));place(gesture.i,x,y)}else msg('请拖到战场内')}if(ghost)ghost.remove();ghost=null;gesture=null});phone.addEventListener('pointercancel',function(){if(levelSwipe){levelSwipe.stage.style.transform='translateX(0px)';levelSwipe=null}if(ghost)ghost.remove();ghost=null;gesture=null});
render();
})();
</script>
</body>
</html>
