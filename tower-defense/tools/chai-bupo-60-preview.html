<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柴不破 · 60° 三视图几何预演</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #171824; color: #f7f0e5; font: 14px system-ui, sans-serif; }
  main { width: min(100vw, 1080px); margin: auto; padding: 18px; }
  canvas { display: block; width: 100%; aspect-ratio: 1.25; border: 1px solid #4e4165; border-radius: 14px; background: #292735; }
  p { margin: 12px 0 0; line-height: 1.55; color: #cfc6dd; }
</style>
<main>
  <strong>柴不破 · 固定镜头：正南 → 正北 · 俯角 60°</strong>
  <canvas id="scene" width="1000" height="800"></canvas>
  <p>仅使用球体、椭圆与多边形预演脚底、斗篷、盾牌和头身关系。正式三视图将沿用这一相机合同，而非正交正面设定图。</p>
</main>
<script>
(() => {
  const canvas = document.querySelector('#scene');
  const ctx = canvas.getContext('2d');
  const elevation = 60 * Math.PI / 180;

  function norm(v) {
    const n = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / n, y: v.y / n, z: v.z / n };
  }

  function cross(a, b) {
    return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
  }

  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }

  function camera() {
    const distance = 11;
    const position = { x: 0, y: -distance * Math.cos(elevation), z: distance * Math.sin(elevation) };
    const forward = norm({ x: 0, y: -position.y, z: -position.z });
    const right = norm(cross(forward, { x: 0, y: 0, z: 1 }));
    return { position, forward, right, up: cross(right, forward), focal: 980 };
  }

  function project(point, cam) {
    const rel = { x: point.x - cam.position.x, y: point.y - cam.position.y, z: point.z - cam.position.z };
    const depth = dot(rel, cam.forward);
    const scale = cam.focal / Math.max(1, depth);
    return { x: canvas.width * .5 + dot(rel, cam.right) * scale, y: canvas.height * .55 - dot(rel, cam.up) * scale, scale };
  }

  function path(points, fill, stroke, width = 1) {
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
  }

  function ground(cam) {
    for (let n = -4; n <= 4; n++) {
      const a = project({ x: n, y: -4, z: 0 }, cam);
      const b = project({ x: n, y: 4, z: 0 }, cam);
      const c = project({ x: -4, y: n, z: 0 }, cam);
      const d = project({ x: 4, y: n, z: 0 }, cam);
      ctx.strokeStyle = n === 0 ? '#8e78a8' : '#514b60';
      ctx.lineWidth = n === 0 ? 1.4 : .8;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
    }
  }

  function oval(x, y, rx, ry, fill, stroke) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  }

  // ═══════════════════════════════════════════════════════ 柴不破几何块
  function shield(center, s, pose) {
    const shift = pose === 'side' ? s * .18 : pose === 'back' ? s * .39 : s * .45;
    const width = pose === 'side' ? s * .31 : s * .44;
    const top = center.y - s * .10;
    const points = [
      { x: center.x + shift - width, y: top - s * .34 },
      { x: center.x + shift + width, y: top - s * .20 },
      { x: center.x + shift + width * .85, y: top + s * .42 },
      { x: center.x + shift, y: top + s * .68 },
      { x: center.x + shift - width * .85, y: top + s * .42 },
    ];
    path(points, '#285ac0', '#d9d8e8', 6);
    path(points, null, '#8e90ac', 2);
  }

  function dog(x, y, pose, label, cam) {
    const foot = project({ x, y, z: .03 }, cam);
    const torso = project({ x, y, z: .63 }, cam);
    const head = project({ x, y, z: 1.34 }, cam);
    const s = foot.scale * .73;
    oval(foot.x, foot.y + s * .18, s * .62, s * .22, 'rgba(0,0,0,.26)');

    // 背面时盾在身体前方，必须先画，才能被斗篷和身体自然遮住。
    if (pose === 'back') shield(torso, s, pose);

    // 斗篷先画，保证身体、头和盾牌的遮挡顺序可见。
    oval(torso.x, torso.y + s * .12, s * .61, s * .45, '#174ca5', '#0f3478');
    if (pose === 'back') {
      oval(torso.x, torso.y + s * .13, s * .22, s * .16, '#fff0de');
      oval(torso.x, torso.y + s * .13, s * .11, s * .08, '#174ca5');
    }

    // 圆润柴犬身体：防御位比近战/远程更宽，脚底占地仍收在阴影内。
    oval(torso.x, torso.y, s * .62, s * .48, '#ee962d', '#c96e20');
    oval(head.x, head.y, s * .68, s * .56, '#f5a23c', '#ce7620');
    oval(head.x - s * .39, head.y - s * .42, s * .19, s * .23, '#ed962f', '#c96e20');
    oval(head.x + s * .39, head.y - s * .42, s * .19, s * .23, '#ed962f', '#c96e20');
    if (pose === 'front') {
      oval(head.x, head.y + s * .16, s * .39, s * .25, '#ffe6c8');
      oval(head.x - s * .22, head.y + s * .03, s * .07, s * .09, '#3d281d');
      oval(head.x + s * .22, head.y + s * .03, s * .07, s * .09, '#3d281d');
      oval(head.x, head.y + s * .16, s * .10, s * .07, '#3d281d');
    } else if (pose === 'side') {
      oval(head.x - s * .30, head.y + s * .12, s * .20, s * .15, '#ffe6c8');
      oval(head.x - s * .44, head.y + s * .10, s * .08, s * .08, '#3d281d');
    } else {
      oval(head.x, head.y + s * .15, s * .55, s * .28, '#f5a23c');
    }
    if (pose !== 'back') shield(torso, s, pose);
    ctx.fillStyle = '#f6e7d7'; ctx.font = '700 20px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(label, foot.x, foot.y + s * .86);
  }

  function draw() {
    const cam = camera();
    const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bg.addColorStop(0, '#302b42'); bg.addColorStop(1, '#171824');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ground(cam);
    dog(-2.25, 1.30, 'front', '正面 · 面向正南', cam);
    dog(0, .15, 'side', '侧面 · 面向西', cam);
    dog(2.25, 1.30, 'back', '背面 · 面向正北', cam);
    ctx.fillStyle = '#f6cb7d'; ctx.font = '700 18px system-ui'; ctx.textAlign = 'left';
    ctx.fillText('柴不破：防御型宽脚底 + 低重心头身 + 右手盾牌', 28, 38);
  }

  draw();
})();
</script>
